name: EPSPreview

options:
  bundleIdPrefix: com.zhangyanbo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Settings shared by every target.
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Pins the concurrency-checking level explicitly instead of inheriting a
    # toolchain default. Verified inert on Xcode 26.6 at swift-version 5:
    # `targeted` compiles to a byte-identical swiftc invocation as leaving
    # this unset, because Xcode only emits a flag for `complete`. Raising it
    # to `complete` (or moving SWIFT_VERSION to 6.0) currently costs exactly
    # one real diagnostic — PreviewViewController's QLPreviewingController
    # conformance crossing into main-actor-isolated code — and wants to be a
    # deliberate pass, not a silent flip.
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # We hand-maintain every Info.plist and .entitlements file; never let
    # Xcode/XcodeGen synthesize or overwrite them.
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    # Ad-hoc signing — no Apple Developer Program account required. The
    # final, authoritative signing (with the right entitlements per target)
    # is done by scripts/build.sh after xcodebuild.
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    # Load-bearing for the XPC peer check: without the hardened runtime,
    # DYLD_INSERT_LIBRARIES gives an attacker a process that still passes
    # every signature and identifier test the render service applies.
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:

  # ──────────────────────────────────────────────────────────────────────
  # Host application. Ships the extensions and shows a one-screen "installed"
  # window. It never renders, so it embeds no render service of its own.
  #
  # NOTE: we intentionally do NOT use XcodeGen's `info:` / `entitlements:`
  # keys — those make XcodeGen *generate* (and overwrite) the files. We
  # only point the build settings at our hand-written files instead.
  # ──────────────────────────────────────────────────────────────────────
  EPSPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/Host
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangyanbo.EPSPreview
        PRODUCT_NAME: EPSPreview
        INFOPLIST_FILE: Sources/Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Host/Host.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: EPSQuickLook
      - target: EPSThumbnail

  # ──────────────────────────────────────────────────────────────────────
  # Quick Look preview extension (spacebar preview). Sandboxed, which macOS
  # 15/26 require for it to be registered at all.
  # ──────────────────────────────────────────────────────────────────────
  EPSQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLook
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangyanbo.EPSPreview.QuickLook
        PRODUCT_NAME: EPSQuickLook
        INFOPLIST_FILE: Sources/QuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/QuickLook/QuickLook.entitlements
        WRAPPER_EXTENSION: appex

  # ──────────────────────────────────────────────────────────────────────
  # Finder / Spotlight thumbnail extension. Same sandbox requirement.
  # ──────────────────────────────────────────────────────────────────────
  EPSThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Thumbnail
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangyanbo.EPSPreview.Thumbnail
        PRODUCT_NAME: EPSThumbnail
        INFOPLIST_FILE: Sources/Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Thumbnail/Thumbnail.entitlements
        WRAPPER_EXTENSION: appex

  # ──────────────────────────────────────────────────────────────────────
  # Render XPC service. NOT sandboxed — this is what lets it spawn the
  # system Ghostscript freely. A copy is embedded into each extension's
  # Contents/XPCServices by scripts/build.sh.
  # ──────────────────────────────────────────────────────────────────────
  RenderService:
    type: xpc-service
    platform: macOS
    sources:
      - path: Sources/RenderService
      - path: Sources/Shared
        # The service renders, it never displays: keeping display-only
        # geometry and paging rules out of this target avoids drift between
        # what's compiled here and what's actually used, and keeps the
        # unsandboxed helper's linked frameworks unchanged for the PDFKit
        # ones (PDFPageGeometry, PreviewPageLayout, ThumbnailDrawing).
        excludes:
          - PDFPageGeometry.swift
          - PreviewPageLayout.swift
          - ThumbnailDrawing.swift
          - ThumbnailGeometry.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangyanbo.EPSPreview.RenderService
        PRODUCT_NAME: RenderService
        INFOPLIST_FILE: Sources/RenderService/Info.plist

  # ──────────────────────────────────────────────────────────────────────
  # Unit tests for the shared code (Ghostscript resolution cache and version
  # floor, admission counter, render-outcome rules, page geometry and preview
  # paging) plus fixture-backed coverage for BundleLayout, thumbnail geometry
  # and thumbnail drawing (the Retina scale / transform chain), and
  # RenderService's XPC peer-trust decision (PeerTrust.swift, compiled in as
  # a single file).
  #
  # It compiles Sources/Shared (and that one RenderService file) itself
  # rather than depending on one of the app targets: everything else under
  # test lives there, and a dependency on EPSPreview would drag the host
  # app's Info.plist / entitlements / signing into a plain library test
  # bundle. This is the one target that may have a generated Info.plist —
  # there is no hand-written one to protect.
  # ──────────────────────────────────────────────────────────────────────
  EPSPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        type: folder
      - path: Sources/Shared
      # Not the whole RenderService target (that would drag in main.swift's
      # top-level executable statements, which Swift forbids linking into a
      # test target) -- just the one file PeerTrustTests exercises.
      - path: Sources/RenderService/PeerTrust.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangyanbo.EPSPreview.Tests
        PRODUCT_NAME: EPSPreviewTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EPSPreview:
    build:
      # The host app, both extensions, and the render XPC service are
      # excluded from the `test` action (everything but that: run, profile,
      # analyze, archive) so `xcodebuild test` only ever builds
      # EPSPreviewTests, which compiles Sources/Shared (plus one
      # RenderService file, PeerTrust.swift) directly and needs none of
      # them. Building them for `test` used to put a full
      # EPSPreview.app with embedded Quick Look/Thumbnail extensions (and
      # RenderService) into DerivedData on every test run — and macOS's
      # LaunchServices auto-registers any such app it finds on disk, so
      # every test run silently registered a stray duplicate of the real
      # /Applications install.
      targets:
        EPSPreview: [run, profile, analyze, archive]
        EPSQuickLook: [run, profile, analyze, archive]
        EPSThumbnail: [run, profile, analyze, archive]
        RenderService: [run, profile, analyze, archive]
        EPSPreviewTests: [test]
    run:
      config: Release
    test:
      targets: [EPSPreviewTests]
    archive:
      config: Release
