included:
  - Sources
  - Tests

# Generated / build output lives outside the `included` trees above, so those
# entries document intent without affecting lint scope. `Tests/Fixtures` is the
# one that does work: now that `Tests` is linted, it keeps the binary EPS inputs
# there out of the scan. Both Sources and Tests are linted so the pre-commit
# hook, which passes staged paths explicitly, agrees with a bare `swiftlint` run.
excluded:
  - build
  - DerivedData
  - out
  - dist
  - Tests/Fixtures

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - toggle_bool
  - unowned_variable_capture
  - weak_delegate

# Only runs under `swiftlint analyze --compiler-log-path …`, not plain
# `swiftlint lint`; not currently wired into any script or CI job — add
# an `swiftlint analyze` invocation (e.g. in scripts/build.sh) before
# relying on this catching anything.
analyzer_rules:
  - unused_import

# A stray force-unwrap should be visible without failing the run — the
# codebase currently has none and this keeps it that way.
force_unwrapping:
  severity: warning

# This codebase consistently uses trailing commas in multi-line collection
# literals, so enforce that direction instead of the rule's default ban.
trailing_comma:
  mandatory_comma: true

identifier_name:
  min_length:
    warning: 2
    error: 2
